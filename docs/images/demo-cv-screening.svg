<div class="lbl">ANSWER · cited from the Act's text only</div>
<p class="as">Assuming you use AI to screen CVs for recruitment or employment decisions.</p>
<h4>Classification as high-risk</h4>
<p>Yes, this likely constitutes a high-risk AI system. Annex III(4)(a) lists as high-risk &#8220;AI systems intended to be used for the recruitment or selection of natural persons, in particular &#8230; to analyse and filter job applications, and to evaluate candidates.&#8221; CV screening directly matches this description.</p>
<h4>Potential exceptions</h4>
<p>Article 6(3) provides a narrow exception where the system does not pose a significant risk of harm, for example when it performs only a narrow procedural or preparatory task. But an Annex III system &#8220;shall always be considered to be high-risk where the AI system performs profiling of natural persons.&#8221;</p>
<h4>What you must do</h4>
<p>Comply with requirements including data governance (Article 10) and accuracy and robustness (Article 15), and document your assessment if you believe the system falls outside the high-risk category (Article 6(4)). &#8230;</p>
<div class="src">Sources: <span class="chip">Annex III(4-5)</span><span class="chip">Article 6(3-5)</span><span class="chip">Article 10(1-3)</span><span class="chip">Article 15(1-4)</span><span class="chip">+6 more</span></div>
