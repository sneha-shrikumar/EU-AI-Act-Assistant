</style>We're using AI to screen CVs. Does that make us high-risk under the EU AI Act?</div></foreignObject>
<foreignObject x="24" y="152" width="580" height="480"><div xmlns="http://www.w3.org/1999/xhtml" class="a"><style>
.q{font:15px/1.5 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;color:#1e3a8a;background:#dbeafe;border-radius:14px;padding:12px 16px;}
